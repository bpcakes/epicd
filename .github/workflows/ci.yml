name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:fast

  integration-tests:
    name: integration-tests (${{ matrix.shard }}/4)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration -- --shard=${{ matrix.shard }}/4 --maxWorkers=3

  platform-contract-tests:
    name: platform-contract-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test -- test/codex-process.integration.test.ts test/store-process.integration.test.ts

  platform-contracts:
    if: always()
    needs: platform-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform contract test
        if: needs.platform-contract-tests.result != 'success'
        run: exit 1
